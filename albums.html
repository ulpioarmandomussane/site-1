<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Álbuns - IFACET</title>
<link rel="icon" type="image/png" href="favicon.ico.jpg">
    <!-- Bootstrap e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilo com fundo desfocado -->
    <style>
        body {
            position: relative;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            z-index: 0;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/fundo.jpg') no-repeat center center fixed;
            background-size: cover;
            filter: blur(8px);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .card {
            background-color: rgba(255, 255, 255, 0.95);
            color: #000;
            border: none;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .album-title {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .nav-bar {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <!-- Menu de navegação simples com botão voltar -->
    <nav class="nav-bar d-flex justify-content-start align-items-center">
        <a href="index.html" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </nav>

    <!-- Conteúdo dos Álbuns -->
    <div class="container my-4">
        <h2 class="text-center mb-4">Galeria de Álbuns</h2>

        <div class="row g-4">
            <!-- Álbum 1 -->
            <div class="col-12 col-sm-6 col-md-4">
                <div class="card">
                    <img src="Imagens/foto 1.jpg" class="card-img-top img-fluid" alt="Álbum 1">
                    <div class="card-body">
                        <p class="album-title">Eventos da Saúde </p>
                        <a href="album1.html" class="btn btn-primary w-100">Ver fotos</a>
                    </div>
                </div>
            </div>

            <!-- Álbum 2 -->
            <div class="col-12 col-sm-6 col-md-4">
                <div class="card">
                    <img src="Imagens/Foto 2.jpg" class="card-img-top img-fluid" alt="Álbum 2">
                    <div class="card-body">
                        <p class="album-title">Formações 2025</p>
                        <a href="album2.html" class="btn btn-primary w-100">Ver fotos</a>
                    </div>
                </div>
            </div>

            <!-- Adicione mais álbuns seguindo o mesmo modelo -->
            <div class="col-12 col-sm-6 col-md-4">
                <div class="card">
                    <img src="Imagens/fundo.jpg" class="card-img-top img-fluid" alt="Álbum 2">
                    <div class="card-body">
                        <p class="album-title">Graduações 2025</p>
                        <a href="album3.html" class="btn btn-primary w-100">Ver fotos</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
